name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: astral-sh/setup-uv@v7

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Sync dependencies
              run: uv sync

            - name: Check for conventional commits
              id: check_commits
              run: |
                  # Get commits since last tag (or all commits if no tags)
                  if git describe --tags &>/dev/null; then
                    LAST_TAG=$(git describe --tags --abbrev=0)
                    COMMITS=$(git log --oneline ${LAST_TAG}..HEAD --format="%H %s")
                  else
                    COMMITS=$(git log --oneline --format="%H %s")
                  fi

                  if [ -z "$COMMITS" ]; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  echo "has_changes=true" >> $GITHUB_OUTPUT
                  echo "Commits since last tag:"
                  echo "$COMMITS"

            - name: Bump version with commitizen
              if: steps.check_commits.outputs.has_changes == 'true'
              run: |
                  uv run cz bump --yes 2>&1 || echo "No conventional commits detected, skipping bump"

            - name: Push changes and tags
              if: steps.check_commits.outputs.has_changes == 'true'
              run: |
                  git push origin main
                  git push origin --tags

            - name: Build package
              run: uv build

            - name: Publish to PyPI
              if: steps.check_commits.outputs.has_changes == 'true'
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
              run: |
                  uv publish --token ${{ secrets.PYPI_TOKEN }} || echo "Publish skipped (token not configured)"

    test-after-release:
        runs-on: ubuntu-latest
        needs: release
        if: success()
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: astral-sh/setup-uv@v7

            - name: Sync and test
              run: |
                  uv sync
                  uv run pytest -vv .
